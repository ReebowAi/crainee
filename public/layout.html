<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crainee Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #3b82f6;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Top Mobile Header bar */
        .mobile-top-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0 15px;
            align-items: center;
            justify-content: space-between;
            z-index: 999;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .menu-toggle:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .mobile-brand {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        /* Sidebar for desktop */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-close {
            display: none;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .sidebar-nav {
            list-style: none;
            padding: 20px 0;
            overflow-y: auto;
            flex: 1;
        }

        .sidebar-nav li a {
            display: block;
            padding: 12px 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-nav li a:hover, .sidebar-nav li a.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
        }

        /* Backdrop overlay for mobile drawer */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 998;
        }

        .sidebar-backdrop.show {
            display: block;
        }

        /* Main Content Wrapper */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            width: calc(100% - 260px);
            transition: margin 0.3s ease;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .mobile-top-bar {
                display: flex;
            }

            .sidebar-close {
                display: block;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
                margin-top: 60px; /* Account for top bar height */
            }
        }
    </style>
</head>
<body>

    <!-- Mobile Top Navigation Bar -->
    <div class="mobile-top-bar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <span class="mobile-brand">Crainee Admin</span>
        <div style="width: 40px;"></div> <!-- Spacer for alignment -->
    </div>

    <!-- Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Sidebar Section -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Crainee Admin</span>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close Navigation">&times;</button>
        </div>
        <ul class="sidebar-nav">
            <li><a href="#" class="active">Overview</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Tier Config</a></li>
            <li><a href="#">Withdrawal Blocks</a></li>
            <li><a href="#">Ticker Banners</a></li>
            <li><a href="#">Market Control</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Audit Log</a></li>
        </ul>
    </aside>

    <!-- Main Dashboard Area -->
    <main class="main-content">
        <h1>Command Overview</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Real-time system telemetry & key liquidity metrics</p>
        <!-- Your dashboard widgets/cards go here -->
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.getElementById('menuToggle');
            const sidebarClose = document.getElementById('sidebarClose');
            const backdrop = document.getElementById('sidebarBackdrop');

            function toggleSidebar() {
                sidebar.classList.toggle('open');
                backdrop.classList.toggle('show');
            }

            menuToggle?.addEventListener('click', toggleSidebar);
            sidebarClose?.addEventListener('click', toggleSidebar);
            backdrop?.addEventListener('click', toggleSidebar);

            // Close sidebar when clicking a link on mobile screens
            const navLinks = document.querySelectorAll('.sidebar-nav a');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth <= 768) {
                        toggleSidebar();
                    }
                });
            });
        });
    </script>
</body>
</html>
