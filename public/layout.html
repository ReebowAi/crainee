<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crainee Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar for desktop */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-nav {
            list-style: none;
            padding: 20px 0;
        }

        .sidebar-nav li a {
            display: block;
            padding: 12px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-nav li a:hover, .sidebar-nav li a.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
        }

        /* Main Content Wrapper */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            width: calc(100% - 260px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Section -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Crainee Admin</div>
        <ul class="sidebar-nav">
            <li><a href="#" class="active">Overview</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Tier Config</a></li>
            <li><a href="#">Withdrawal Blocks</a></li>
            <li><a href="#">Ticker Banners</a></li>
            <li><a href="#">Market Control</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="#">Audit Log</a></li>
        </ul>
    </aside>

    <!-- Main Dashboard Area -->
    <main class="main-content">
        <h1>Command Overview</h1>
        <p>Real-time system telemetry & key liquidity metrics</p>
        <!-- Your dashboard widgets/cards go here -->
    </main>

</body>
</html>
