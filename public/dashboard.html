<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Crainee</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        /* --- Unique Redesigned Environment & Lighting --- */
        :root {
            --bg-deep: #05070b;
            --surface: rgba(13, 17, 23, 0.85);
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Interactive Light Layer */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(900px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(59, 130, 246, 0.09), transparent 65%);
            z-index: 1;
        }

        /* Loading Screen Enhancement */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-content {
            text-align: center;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid var(--surface-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            max-width: 400px;
            width: 90%;
        }

        .loading-logo {
            width: 160px;
            height: auto;
            fill: var(--primary);
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 1.25rem auto;
        }

        .loading-content p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* App & Layout Enhancements */
        .app-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--surface-border);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-link .logo {
            width: 130px;
            height: auto;
            color: var(--text-main);
        }

        .btn-ghost {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
    </style>
</head>

        <!-- Dashboard Layout Grid Container -->
        <div class="dashboard-layout">
            <!-- Sidebar Navigation -->
            <aside class="sidebar">
                <nav>
                    <a href="/dashboard" class="sidebar-nav-item active">Dashboard</a>
                    <a href="/markets" class="sidebar-nav-item">Markets</a>
                    <a href="/portfolio" class="sidebar-nav-item">Portfolio</a>
                    <a href="/settings" class="sidebar-nav-item">Settings</a>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <div class="card">
                    <h2 class="card-title">Institutional Overview</h2>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Real-time asset telemetry and portfolio performance metrics.</p>
                </div>

    <!-- Required Scripts Integration -->
    <script src="/js/websocket.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/dashboard.js"></script>
    <script>
        // Interactive Mouse Ambient Light Tracking
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--mouse-x', `${x}%`);
            document.documentElement.style.setProperty('--mouse-y', `${y}%`);
        });

        // Hide Loading Screen on Window Load with Smooth Fade
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loadingScreen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                }
                const app = document.getElementById('app');
                if (app) app.style.display = 'flex';
            }, 400);
        });
    </script>
</body>
</html>
