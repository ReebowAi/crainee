name: Deep Verify & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deep-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Deep Syntax Validation on All JS Files
      run: |
        echo "Checking syntax across all backend and frontend JavaScript files..."
        find . -name "*.js" -not -path "./node_modules/*" | while read file; do
          echo "Checking syntax: $file"
          node -c "$file"
        done

    - name: Verify Essential Architecture Files Exist
      run: |
        REQUIRED_FILES=(
          "server.js"
          "routes/api.js"
          "database/db.js"
          "websocket/ws-handler.js"
          "services/market-simulator.js"
          "public/index.html"
          "public/dashboard.html"
          "public/admin.html"
          "public/js/dashboard.js"
        )
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ CRITICAL ERROR: Essential file missing -> $file"
            exit 1
          else
            echo "✅ Found: $file"
          fi
        done

    - name: Run Backend Integration & Endpoint Sanity Check
      env:
        PORT: 3001
        JWT_SECRET: 'test-secret-key'
      run: |
        echo "Starting server in background for integration test..."
        node server.js &
        SERVER_PID=$!
        
        # Give server a few seconds to boot up and initialize SQLite DB
        sleep 4

        echo "Testing /api/health endpoint..."
        HEALTH_RES=$(curl -s http://localhost:3001/api/health)
        echo "Health response: $HEALTH_RES"
        
        if echo "$HEALTH_RES" | grep -q "ok"; then
          echo "✅ Health check passed!"
        else
          echo "❌ Health check failed!"
          kill $SERVER_PID
          exit 1
        end

        echo "Testing market assets API endpoint..."
        ASSETS_RES=$(curl -s http://localhost:3001/api/market/assets)
        echo "Assets response snippet: ${ASSETS_RES:0,100}"

        if echo "$ASSETS_RES" | grep -q "assets"; then
          echo "✅ Market assets endpoint passed!"
        else
          echo "❌ Market assets endpoint failed!"
          kill $SERVER_PID
          exit 1
        end

        echo "Shutting down test server..."
        kill $SERVER_PID
        echo "🎉 All deep verification checks passed successfully!"
